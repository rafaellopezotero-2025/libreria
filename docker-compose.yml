# Compose raíz: un solo "docker compose up -d --build" levanta todo el sistema.
# Requiere Docker Compose >= 2.20 (por la directiva "include").
# La primera vez correr ./install.sh, que genera los secretos y los .env.

include:
  - path: ./docker/supabase/docker-compose.yml
    project_directory: ./docker/supabase
    env_file: ./docker/supabase/.env

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_API_PORT: ${VITE_API_PORT:-8000}
    container_name: libreria-web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
